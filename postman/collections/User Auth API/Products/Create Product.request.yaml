$kind: http-request
method: POST
url: '{{baseUrl}}/api/products'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{sellerToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Product",
      "description": "A test product",
      "price": 99.99,
      "quantity": 50
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Has productId", () => pm.expect(pm.response.json()).to.have.property("productId"));
      if (pm.response.code === 201) {
        pm.environment.set("productId", pm.response.json().productId);
      }
