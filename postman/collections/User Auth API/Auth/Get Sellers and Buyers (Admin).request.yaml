$kind: http-request
method: GET
url: '{{baseUrl}}/api/auth/admin/users'
order: 15000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has users", () => pm.expect(pm.response.json()).to.have.property("users"));
