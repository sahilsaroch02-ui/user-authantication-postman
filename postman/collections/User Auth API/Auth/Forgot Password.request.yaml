$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
order: 12000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 500", () => pm.expect([200, 500]).to.include(pm.response.code));
      pm.test("Has message", () => pm.expect(pm.response.json()).to.have.property("message"));
