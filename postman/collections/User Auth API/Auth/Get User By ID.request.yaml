$kind: http-request
method: GET
url: '{{baseUrl}}/api/auth/users/{{userId}}'
order: 14000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has user", () => pm.expect(pm.response.json()).to.have.property("user"));
