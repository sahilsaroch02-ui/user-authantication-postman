$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/signup'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "testuser@example.com",
      "password": "Test@1234",
      "role": "user"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Has message", () => pm.expect(pm.response.json()).to.have.property("message"));
      pm.test("Has userId", () => pm.expect(pm.response.json()).to.have.property("userId"));
      if (pm.response.code === 201) {
        pm.environment.set("userId", pm.response.json().userId);
      }
