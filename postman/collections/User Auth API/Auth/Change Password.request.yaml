$kind: http-request
method: PUT
url: '{{baseUrl}}/api/auth/change-password'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Test@1234",
      "newPassword": "NewTest@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Password changed", () => pm.expect(pm.response.json()).to.have.property("message"));
