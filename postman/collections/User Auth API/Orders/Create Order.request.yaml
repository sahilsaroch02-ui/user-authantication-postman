$kind: http-request
method: POST
url: '{{baseUrl}}/api/orders'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{buyerToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Has orderId", () => pm.expect(pm.response.json()).to.have.property("orderId"));
      pm.test("Has totalAmount", () => pm.expect(pm.response.json()).to.have.property("totalAmount"));
      if (pm.response.code === 201) {
        pm.environment.set("orderId", pm.response.json().orderId);
      }
