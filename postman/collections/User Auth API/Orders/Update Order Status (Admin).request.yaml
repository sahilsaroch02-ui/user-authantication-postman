$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/orders/{{orderId}}/status'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "shipped"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has message", () => pm.expect(pm.response.json()).to.have.property("message"));
