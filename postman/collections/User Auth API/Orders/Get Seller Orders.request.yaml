$kind: http-request
method: GET
url: '{{baseUrl}}/api/orders/seller-orders'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{sellerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has orders array", () => pm.expect(pm.response.json()).to.have.property("orders"));
